                'cai_xi': { text: '子女/下属很会来事，逢年过节大包小包买好东西来看你，开的车、穿的牌子都很体面。别人一见到你，都会因为你的孩子/下属而对你高看一眼。' },

                'shishang_xi': { text: '子女/下属极其活泼可爱，嘴跟抹了蜜一样甜，或者在外人面前能歌善舞、展现出某项惊人的特长。' },
                'shishang_ji': { text: '子女/下属在外面疯疯癫癫、不懂分寸、乱开玩笑，或者总是因为多嘴多舌惹出乱子，让你去给别人赔礼道歉。' },
                'guansha_xi': { text: '子女/下属在外头有头有脸，可能是个小领导，或者穿着制服。外人一见到你，都会因为你的孩子/下属而对你高看一眼。' },
                'guansha_ji': { text: '子女/下属在外头是个小头目，但对你却像对待下属一样呼来喝去。或者外人看到你的孩子/下属对你极其严厉、冷漠。' },
                'bijie_xi': { text: '子女/下属跟你在一起时，没有代沟，勾肩搭背，称兄道弟。外人看着觉得你们家氛围真好。' },
                'bijie_ji': { text: '子女/下属在外人面前对你毫无敬畏之心，甚至当众顶撞你、打断你说话，或者狐假虎威打着你的旗号在外面惹事。' }
            },
            // 时支星神 - 喜/忌分开的文本
            hourZhiStar: {
                'yin_xi': { text: '孩子/下属性格沉稳、有学问、重感情。晚年极其幸福，孩子无微不至地照顾你。' },
                'yin_ji': { text: '极度依赖你，缺乏独立性，甚至有些懒惰。典型的"啃老"或者"拖累"，你成了他们的提款机。' },
                'cai_xi': { text: '孩子/下属极其务实、会赚钱、懂理财。他们表达爱的方式就是"给钱"。晚年你不仅不缺钱，还能住他们买的大房子。' },
                'cai_ji': { text: '孩子/下属极其物质、败家，或者因为债务、生意失败把你拖下水。你成了孩子的"提款机"。' },
                'shishang_xi': { text: '孩子多才多艺、嘴巴甜、性格开朗。你的晚年绝对不会寂寞！他们把家里布置得像游乐园。' },
                'shishang_ji': { text: '孩子极其任性、胡作非为、好逸恶劳。他们是来"讨债"的，你晚年的大部分时间和金钱，都耗在给他们的烂摊子擦屁股上。' },
                'guansha_xi': { text: '孩子/下属极其有出息！大概率是当官的、大企业的高管。你晚年最大的享受是"面子"。' },
                'guansha_ji': { text: '孩子虽然可能有地位，但脾气极其暴躁、大男子/大女子主义。你在自己家里都活得小心翼翼，毫无晚年尊严可言。' },
                'bijie_xi': { text: '孩子/下属性格刚强、极其独立、有能力。你们之间没有传统的"依附感"，更像平等的哥们儿。你晚年很有自己的圈子，不依赖孩子，潇洒自在。' },
                'bijie_ji': { text: '孩子/下属极其自我、叛逆、不孝。典型的"养不熟的白眼狼"，他们不仅不赡养你，还可能为了家产跟你大打出手。' }
            }
        };

        // 成对题目的映射：喜忌步骤 -> 星神步骤
        var pairMap = {
            monthGanXiJi: 'monthGanStar',
            monthZhiXiJi: 'monthZhiStar',
            hourGanXiJi: 'hourGanStar',
            hourZhiXiJi: 'hourZhiStar'
        };

        // 反向映射：星神步骤 -> 喜忌步骤
        var starToXiJi = {};
        Object.keys(pairMap).forEach(function(k) { starToXiJi[pairMap[k]] = k; });

        var selections = {};
        var pageKeys = Object.keys(data);
        var currentPage = 0;

        function init() {
            buildPages();
            showPage(0);
        }

        function buildPages() {
            var container = $('#pagesContainer');
            pageKeys.forEach(function(key, i) {
                var item = data[key];
                var pageHtml = '<div class="page" id="page_' + i + '">' +
                    '<div class="page-title">' + (i + 1) + '. ' + item.title + '</div>' +
                    '<div class="page-desc">' + item.desc + '</div>';

                if (item.type === 'multi') {
                    pageHtml += '<div class="multi-tip">（可多选，请选择所有符合的项）</div>';
                }

                pageHtml += '<div class="option-list" id="options_' + i + '">';
                item.options.forEach(function(opt, j) {
                    var inputType = item.type === 'multi' ? 'checkbox' : 'radio';
                    var name = 'page_' + i;
                    pageHtml += '<div class="option-item" onclick="toggleOption(this, ' + i + ', \'' + opt.value + '\', \'' + item.type + '\')">' +
                        '<input type="' + inputType + '" name="' + name + '" value="' + opt.value + '" id="opt_' + i + '_' + j + '">' +
                        '<div class="option-text">' +
                        '<div class="label">' + opt.label + '</div>' +
                        '</div>' +
                        '</div>';
                });
                pageHtml += '</div>';

                pageHtml += '<div class="nav-buttons">' +
                    (i > 0 ? '<button class="btn btn-prev" onclick="showPage(' + (i - 1) + ')">上一步</button>' : '<div></div>') +
                    '<button class="btn btn-next" onclick="goNext(' + i + ')">下一步</button>' +
                    '</div>';

                pageHtml += '</div>';
                container.append(pageHtml);
            });
        }

        window.toggleOption = function(el, pageIdx, value, type) {
            var $el = $(el);
            var $input = $el.find('input');
            var key = pageKeys[pageIdx];

            if (type === 'multi') {
                $input.prop('checked', !$input.prop('checked'));
                if ($input.prop('checked')) {
                    $el.addClass('multi-selected');
                } else {
                    $el.removeClass('multi-selected');
                }
                if (!selections[key]) { selections[key] = []; }
                var arr = selections[key];
                var idx = arr.indexOf(value);
                if ($input.prop('checked')) {
                    if (idx === -1) arr.push(value);
                } else {
                    if (idx !== -1) arr.splice(idx, 1);
                }
            } else {
                $el.siblings('.option-item').removeClass('selected');
                $el.addClass('selected');
                $input.prop('checked', true);
                $('input[name="' + $input.attr('name') + '"]').not($input).prop('checked', false);
                selections[key] = value;
            }
        };

        window.goNext = function(pageIdx) {
            var key = pageKeys[pageIdx];
            var sel = selections[key];
            var item = data[key];

            if (item.type === 'multi') {
                if (!sel || sel.length === 0) { alert('请至少选择一项'); return; }
            } else {
                if (!sel) { alert('请先做出选择'); return; }
            }

            if (pageIdx < pageKeys.length - 1) {
                showPage(pageIdx + 1);
            } else {
                showSummary();
            }
        };

        window.showPage = function(idx) {
            currentPage = idx;
            $('.page').removeClass('active');
            $('#page_' + idx).addClass('active');
            $('#summaryPage').removeClass('active');

            var key = pageKeys[idx];
            var item = data[key];
            var $items = $('#options_' + idx + ' .option-item');

            if (item.type === 'multi') {
                $items.each(function() {
                    var val = $(this).find('input').val();
                    if (selections[key] && selections[key].indexOf(val) !== -1) {
                        $(this).addClass('multi-selected');
                        $(this).find('input').prop('checked', true);
                    } else {
                        $(this).removeClass('multi-selected');
                        $(this).find('input').prop('checked', false);
                    }
                });
            } else {
                $items.each(function() {
                    var val = $(this).find('input').val();
                    if (selections[key] === val) {
                        $(this).addClass('selected');
                        $(this).find('input').prop('checked', true);
                    } else {
                        $(this).removeClass('selected');
                        $(this).find('input').prop('checked', false);
                    }
                });
            }
        };

        function getOptionLabel(key, value) {
            var item = data[key];
            for (var i = 0; i < item.options.length; i++) {
                if (item.options[i].value === value) return item.options[i].label;
            }
            return value;
        }

        function showSummary() {
            $('.page').removeClass('active');
            $('#summaryPage').addClass('active');

            var html = '';
            pageKeys.forEach(function(key, i) {
                var sel = selections[key];
                if (!sel || (Array.isArray(sel) && sel.length === 0)) return;

                // 如果是喜忌步骤且有配对的星神步骤，跳过（将在星神步骤中合并显示）
                if (pairMap[key] && selections[pairMap[key]]) {
                    return;
                }

                html += '<div class="summary-row">';
                html += '<span class="row-title">' + (i + 1) + '. ' + data[key].title + '：</span>';

                if (Array.isArray(sel)) {
                    // 多选：显示所有选中项的label
                    var labels = [];
                    sel.forEach(function(v) { labels.push(getOptionLabel(key, v)); });
                    html += '<span class="row-value">' + labels.join('、') + '</span>';
                    // 显示每个选中项的完整结果文本（"无明显受伤"无对应文本，不显示）
                    sel.forEach(function(v) {
                        if (results[key] && results[key][v] && results[key][v].text) {
                            html += '<div style="width:100%;margin-top:4px;color:#555;">' + results[key][v].text.replace(/\n/g, '<br>') + '</div>';
                        }
                    });
                } else {
                    // 检查是否是星神步骤（有配对的喜忌步骤）
                    var pairedXiJiKey = starToXiJi[key];
                    if (pairedXiJiKey && selections[pairedXiJiKey]) {
                        // 成对显示：喜忌label — 星神label + 对应文本
                        var xiJiLabel = getOptionLabel(pairedXiJiKey, selections[pairedXiJiKey]);
                        var starLabel = getOptionLabel(key, sel);
                        html += '<span class="row-value">' + xiJiLabel + ' — ' + starLabel + '</span>';

                        // 根据喜忌选择对应的文本（combinedKey = starValue_xi 或 starValue_ji）
                        var xiJiVal = selections[pairedXiJiKey]; // 'xi' or 'ji'
                        var combinedKey = sel + '_' + xiJiVal;
                        if (results[key] && results[key][combinedKey] && results[key][combinedKey].text) {
                            html += '<span class="row-result"> ' + results[key][combinedKey].text + '</span>';
                        }
                    } else {
                        // 普通单选：显示label + 结果文本
                        html += '<span class="row-value">' + getOptionLabel(key, sel) + '</span>';
                        if (results[key] && results[key][sel] && results[key][sel].text) {
                            html += '<span class="row-result"> ' + results[key][sel].text.replace(/\n/g, '<br>') + '</span>';
                        }
                    }
                }
                html += '</div>';
            });

            $('#summaryContent').html(html);
        }

        window.restartAll = function() {
            selections = {};
            $('.page').removeClass('active');
            $('#summaryPage').removeClass('active');
            $('.option-item').removeClass('selected multi-selected');
            $('input[type="radio"], input[type="checkbox"]').prop('checked', false);
            showPage(0);
        };

        init();
    });
    </script>
</main>
</div>
</body>
</html>
