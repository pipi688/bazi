<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夫妻星与夫妻宫 · 命理分析系统</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --gold: #f5a623;
    --text: #e0e0e0;
    --text-dim: #888;
    --border: #2a2a4a;
    --green: #4ade80;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --pink: #f472b6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
  }
  .header h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  /* Progress Bar */
  .progress-wrap {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 20px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 3px;
    transition: width 0.5s ease;
    width: 0%;
  }
  .progress-text {
    text-align: right;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Step Indicator */
  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 20px auto;
    max-width: 900px;
    padding: 0 10px;
  }
  .step-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s;
  }
  .step-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .step-dot.done { background: var(--green); }

  /* Main Container */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Question Card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 30px;
    margin-bottom: 24px;
    animation: fadeIn 0.5s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .question-label {
    font-size: 0.85rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .question-title {
    font-size: 1.4rem;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* Option Buttons */
  .options {
    display: grid;
    gap: 12px;
  }
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
  }
  .opt-btn:hover {
    border-color: var(--accent);
    background: rgba(233,69,96,0.08);
    transform: translateX(4px);
  }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn.selected {
    border-color: var(--accent);
    background: rgba(233,69,96,0.15);
    box-shadow: 0 0 20px rgba(233,69,96,0.2);
  }
  .opt-btn .icon {
    font-size: 1.5rem;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .opt-btn .opt-text {
    flex: 1;
    line-height: 1.5;
  }
  .opt-btn .opt-desc {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Nav Buttons */
  .nav-btns {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    gap: 12px;
  }
  .nav-btn {
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    transition: all 0.25s;
  }
  .nav-btn:hover { border-color: var(--accent); }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    border: none;
    color: #fff;
  }
  .nav-btn.primary:hover { filter: brightness(1.15); }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Result Card */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 30px;
    margin-bottom: 24px;
    animation: fadeIn 0.6s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .result-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .result-header h2 {
    font-size: 1.6rem;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Summary Table */
  .summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 28px;
  }
  .summary-table th, .summary-table td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .summary-table th {
    color: var(--gold);
    font-weight: 600;
    width: 35%;
    background: rgba(245,166,35,0.05);
  }
  .summary-table td {
    color: var(--text);
  }

  /* Result Sections */
  .result-section {
    margin-bottom: 24px;
    padding: 20px;
    border-radius: 12px;
    border-left: 4px solid var(--accent);
    background: rgba(233,69,96,0.04);
  }
  .result-section.green { border-left-color: var(--green); background: rgba(74,222,128,0.04); }
  .result-section.blue { border-left-color: var(--blue); background: rgba(96,165,250,0.04); }
  .result-section.gold { border-left-color: var(--gold); background: rgba(245,166,35,0.04); }
  .result-section.purple { border-left-color: var(--purple); background: rgba(167,139,250,0.04); }
  .result-section.pink { border-left-color: var(--pink); background: rgba(244,114,182,0.04); }

  .result-section h3 {
    font-size: 1.1rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-section p {
    line-height: 1.8;
    color: #ccc;
    font-size: 0.95rem;
  }
  .result-section .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    margin-left: 6px;
    vertical-align: middle;
  }
  .tag-good { background: rgba(74,222,128,0.15); color: var(--green); }
  .tag-bad { background: rgba(233,69,96,0.15); color: var(--accent); }
  .tag-warn { background: rgba(245,166,35,0.15); color: var(--gold); }
  .tag-info { background: rgba(96,165,250,0.15); color: var(--blue); }

  /* Restart Button */
  .restart-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .restart-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

  /* Footer */
  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.4rem; }
    .question-card { padding: 24px 18px; }
    .question-title { font-size: 1.15rem; }
    .opt-btn { padding: 14px 14px; font-size: 0.92rem; }
    .result-card { padding: 24px 18px; }
    .summary-table th, .summary-table td { padding: 8px 10px; font-size: 0.82rem; }
  }

  /* Breadcrumb path */
  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .breadcrumb span {
    padding: 3px 10px;
    background: var(--card2);
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .breadcrumb .sep { background: none; border: none; padding: 0; }

  /* Animations */
  .pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🔮 夫妻星与夫妻宫 · 命理分析系统</h1>
  <p>依次选择各项条件，获取专属婚姻感情解读</p>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 步已完成</div>
</div>

<div class="step-indicator" id="stepIndicator"></div>

<div class="container" id="app"></div>

<div class="footer">
  本系统仅供娱乐参考，命由己造，福自我求 ✨
</div>

<script>
// ========== DATA ==========
const FLOW = [
  // Step 0: 性别
  {
    key: 'gender',
    label: '基本信息',
    title: '您的性别是？',
    icon: '👤',
    options: [
      { value: 'female', text: '女', desc: '女性命盘分析', icon: '♀️' },
      { value: 'male', text: '男', desc: '男性命盘分析', icon: '♂️' },
    ]
  },
  // Step 1: 有无夫妻星
  {
    key: 'hasSpouseStar',
    label: '夫妻星',
    title: '命局中是否有夫妻星？',
    icon: '⭐',
    options: [
      { value: 'none', text: '没有夫妻星', desc: '命局中无正官/七杀（女）或无正财/偏财（男）', icon: '🌑' },
      { value: 'has', text: '有夫妻星', desc: '命局中存在夫妻星', icon: '🌟' },
    ]
  },
  // Step 2: 夫妻星类型（仅在有夫妻星时）
  {
    key: 'spouseStarType',
    label: '夫妻星类型',
    title: '夫妻星属于哪种类型？',
    icon: '🔍',
    condition: (s) => s.hasSpouseStar === 'has',
    options: [
      { value: 'zheng', text: '正官 / 正财', desc: '正统、合法、持久的婚姻', icon: '💍' },
      { value: 'qiasha', text: '七杀 / 偏财', desc: '激情、偏门、不稳定的缘分', icon: '🔥' },
      { value: 'mix', text: '官杀混杂 / 财星混杂', desc: '容易多段感情，或婚前有纠葛', icon: '🌀' },
    ]
  },
  // Step 3: 夫妻星旺衰
  {
    key: 'spouseStarStrength',
    label: '夫妻星旺衰',
    title: '夫妻星的力量状态如何？',
    icon: '📊',
    condition: (s) => s.hasSpouseStar === 'has',
    options: [
      { value: 'strong', text: '夫妻星旺', desc: '夫妻星力量强', icon: '💪' },
      { value: 'weak', text: '夫妻星弱', desc: '夫妻星力量弱', icon: '🍃' },
    ]
  },
  // Step 4: 夫妻星喜忌
  {
    key: 'spouseStarXiJi',
    label: '夫妻星喜忌',
    title: '夫妻星是喜神还是忌神？',
    icon: '🎯',
    condition: (s) => s.hasSpouseStar === 'has',
    options: [
      { value: 'xi', text: '喜神', desc: '对命主有利', icon: '✅' },
      { value: 'ji', text: '忌神', desc: '对命主不利', icon: '⚠️' },
    ]
  },
  // Step 5: 夫妻宫
  {
    key: 'spousePalace',
    label: '夫妻宫',
    title: '夫妻宫（日支）的状态是？',
    icon: '🏠',
    options: [
      { value: 'xi', text: '夫妻宫为喜', desc: '婚后生活环境好，家里温馨', icon: '🏡' },
      { value: 'ji', text: '夫妻宫为忌', desc: '婚后觉得家是牢笼，易有烦心事', icon: '🔒' },
    ]
  },
  // Step 6: 夫妻宫被作用
  {
    key: 'palaceInteraction',
    label: '夫妻宫作用',
    title: '夫妻宫是否受到其他地支的作用？',
    icon: '⚡',
    options: [
      { value: 'chong', text: '夫妻宫被冲', desc: '极度不稳定，频繁争吵或异地', icon: '💥' },
      { value: 'he', text: '夫妻宫被合', desc: '长期冷暴力、互相折磨', icon: '🔗' },
      { value: 'xing', text: '夫妻宫被刑', desc: '有隔阂，彼此防备', icon: '🚧' },
      { value: 'hai', text: '夫妻宫被害', desc: '因误会闹矛盾', icon: '🤕' },
      { value: 'heban', text: '夫妻宫被合绊', desc: '感情被某事/某人牵制', icon: '⛓️' },
      { value: 'none', text: '没有明显作用', desc: '夫妻宫相对安静', icon: '😌' },
    ]
  },
  // Step 7: 合绊细分
  {
    key: 'hebanDetail',
    label: '合绊类型',
    title: '夫妻宫被哪种合绊影响？',
    icon: '🔗',
    condition: (s) => s.palaceInteraction === 'heban',
    options: [
      { value: 'year', text: '被年支合绊', desc: '长辈/原生家庭牵绊', icon: '👨‍👩‍👧' },
      { value: 'month', text: '被月支合绊', desc: '事业/社交圈牵绊', icon: '💼' },
      { value: 'hour', text: '被时支合绊', desc: '子女/未来牵绊', icon: '👶' },
    ]
  },
  // Step 8: 夫妻宫坐着谁
  {
    key: 'palaceSits',
    label: '宫位十神',
    title: '夫妻宫（日支）坐着的十神是？',
    icon: '📿',
    options: [
      { value: 'yin', text: '印星', desc: '伴侣像"妈"一样照顾', icon: '🤱' },
      { value: 'shishang', text: '食伤', desc: '伴侣风趣有才艺', icon: '🎨' },
      { value: 'bijie', text: '比劫', desc: '伴侣独立有主见', icon: '🤝' },
      { value: 'cai', text: '财星', desc: '伴侣务实能干', icon: '💰' },
      { value: 'guansha', text: '官杀', desc: '伴侣有担当有控制力', icon: '🛡️' },
    ]
  },
  // Step 9: 宫位十神旺衰
  {
    key: 'palaceSitsStrength',
    label: '十神旺衰',
    title: '该十神在夫妻宫中的力量如何？',
    icon: '📈',
    options: [
      { value: 'strong', text: '旺', desc: '该十神力量强', icon: '🔴' },
      { value: 'weak', text: '弱', desc: '该十神力量弱', icon: '⚪' },
    ]
  },
  // Step 10: 全局力量对比
  {
    key: 'globalStrength',
    label: '全局力量',
    title: '命局中男女双方力量对比如何？',
    icon: '⚖️',
    options: [
      { value: 'femaleWeakMaleStrong', text: '女弱男强', desc: '女方命弱，男方命强', icon: '👩‍🦰👨‍🦱' },
      { value: 'femaleStrongMaleWeak', text: '女强男弱', desc: '女方命强，男方命弱', icon: '💪👨‍🦱' },
      { value: 'bothStrong', text: '女强男强', desc: '双方命局都强', icon: '💪💪' },
      { value: 'bothWeak', text: '女弱男弱', desc: '双方命局都弱', icon: '🍃🍃' },
    ]
  },
  // Step 11: 夫妻星与夫妻宫互动
  {
    key: 'starPalaceInteraction',
    label: '星宫互动',
    title: '夫妻星与夫妻宫之间如何互动？',
    icon: '🔄',
    condition: (s) => s.hasSpouseStar === 'has',
    options: [
      { value: 'starShengPalace', text: '夫妻星生夫妻宫', desc: '星生宫', icon: '➡️' },
      { value: 'starKePalace', text: '夫妻星克夫妻宫', desc: '星克宫', icon: '⚔️' },
      { value: 'palaceShengStar', text: '夫妻宫生夫妻星', desc: '宫生星', icon: '⬅️' },
      { value: 'palaceKeStar', text: '夫妻宫克夫妻星', desc: '宫克星', icon: '🛡️' },
      { value: 'starSitsPalace', text: '夫妻星坐在夫妻宫上', desc: '星宫同柱', icon: '💎' },
    ]
  },
  // Step 12: 日支藏干十神
  {
    key: 'hiddenStem',
    label: '藏干十神',
    title: '您把伴侣视为什么角色？',
    icon: '🎭',
    options: [
      { value: 'cai', text: '财星', desc: '把伴侣当"财神爷/现实依靠"', icon: '💰' },
      { value: 'guansha', text: '官杀', desc: '把伴侣当"权威/保护伞"', icon: '🛡️' },
      { value: 'yin', text: '印星', desc: '把伴侣当"妈/精神避风港"', icon: '🤱' },
      { value: 'bijie', text: '比劫', desc: '把伴侣当"哥们/竞争对手"', icon: '🤝' },
    ]
  },
  // Step 13: 婚姻状态
  {
    key: 'marriageStatus',
    label: '婚姻状态',
    title: '当前的婚姻/感情状态是？',
    icon: '💑',
    options: [
      { value: 'unmarried', text: '未婚', desc: '尚未结婚', icon: '🙋' },
      { value: 'married', text: '已婚', desc: '已经结婚', icon: '💒' },
      { value: 'divorced', text: '离婚', desc: '已经离婚', icon: '💔' },
    ]
  },
];

// ========== RESULTS MAP ==========
function getResult(state) {
  const r = { sections: [] };

  // --- 1. 夫妻星基础判断 ---
  if (state.hasSpouseStar === 'none') {
    r.sections.push({
      title: '📌 夫妻星缺失',
      cls: 'pink',
      content: '缘分薄，或者对婚姻不感兴趣。命局中没有明显的夫妻星，代表感情缘分较淡，可能需要大运流年引动才会出现姻缘。',
      tag: { text: '需大运流年引动', cls: 'tag-warn' }
    });
  } else {
    // 有夫妻星
    let starTypeText = '';
    if (state.spouseStarType === 'zheng') starTypeText = '正官/正财（正统、合法、持久的婚姻）';
    else if (state.spouseStarType === 'qiasha') starTypeText = '七杀/偏财（激情、偏门、不稳定的缘分）';
    else if (state.spouseStarType === 'mix') starTypeText = '官杀混杂/财星混杂（容易多段感情，婚前有纠葛）';

    let strengthText = state.spouseStarStrength === 'strong' ? '夫妻星旺' : '夫妻星弱';
    let xijiText = state.spouseStarXiJi === 'xi' ? '喜神' : '忌神';

    let starResult = '';
    if (state.spouseStarStrength === 'strong') {
      if (state.spouseStarXiJi === 'xi') {
        starResult = '伴侣能力强，能帮到自己，婚姻幸福。';
      } else {
        starResult = '伴侣是来讨债的，给自己带来巨大压力。';
      }
    } else {
      if (state.spouseStarXiJi === 'xi') {
        starResult = '伴侣人很好，但能力有限，帮不上大忙。';
      } else {
        starResult = '伴侣想管你，但没那个实力，最后变成两人的心理暗战。';
      }
    }

    r.sections.push({
      title: '📌 夫妻星分析',
      cls: 'blue',
      content: `<b>类型：</b>${starTypeText}<br><b>状态：</b>${strengthText}，${xijiText}<br><b>解读：</b>${starResult}`,

  if (state.palaceSitsStrength === 'strong') {

        iTag = { text: '大吉', cls: 'tag-good' };
      } else if (state.spouseStarXiJi === 'ji' && state.spousePalace === 'ji') {

        iTag = { text: '大凶', cls: 'tag-bad' };
      } else if (state.spouseStarXiJi === 'xi' && state.spousePalace === 'ji') {

        iTag = { text: '人好环境差', cls: 'tag-warn' };
      } else {

        iTag = { text: '环境兜底', cls: 'tag-info' };

    }
    r.sections.push({
      title: '🔄 星宫互动分析',

      content: interactionText,
      tag: iTag
    });
  }

  // --- 7. 藏干十神 ---
  const hiddenMap = {
    cai: { name: '财星', desc: '你把伴侣视为"财神爷/现实依靠"，在关系中注重物质和现实层面的安全感。' },
    guansha: { name: '官杀', desc: '你把伴侣视为"权威/保护伞"，在关系中寻求安全感和被保护的感觉。' },
    yin: { name: '印星', desc: '你把伴侣视为"妈/精神避风港"，容易产生依赖，在关系中寻求精神慰藉和包容。' },
    bijie: { name: '比劫', desc: '你把伴侣视为"哥们/竞争对手"，容易互怼，关系中缺乏浪漫，更像搭档或对手。' },

  const hInfo = hiddenMap[state.hiddenStem] || { name: '', desc: '' };

// ========== APP STATE ==========
let state = {};
let currentStep = 0;

function getVisibleSteps() {
  return FLOW.filter(s => !s.condition || s.condition(state));
}

function render() {
  const app = document.getElementById('app');
  const visibleSteps = getVisibleSteps();
  const totalSteps = visibleSteps.length;

  // Progress
  const doneCount = visibleSteps.filter((_, i) => i < currentStep && state[visibleSteps[i].key] !== undefined).length;
  document.getElementById('progressFill').style.width = `${(doneCount / totalSteps) * 100}%`;
  document.getElementById('progressText').textContent = `${doneCount} / ${totalSteps} 步已完成`;

  // Step dots
  const indicator = document.getElementById('stepIndicator');
  indicator.innerHTML = visibleSteps.map((s, i) => {
    const isDone = i < currentStep && state[s.key] !== undefined;
    const isActive = i === currentStep;
    return `<div class="step-dot ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" title="${s.label}"></div>`;
  }).join('');

  // If all steps done → show result
  if (currentStep >= totalSteps) {
    renderResult(app);
    return;
  }

  const step = visibleSteps[currentStep];
  const selectedVal = state[step.key];

  let html = `
    <div class="question-card">
      <div class="question-label">${step.icon} ${step.label} · 第 ${currentStep + 1} 步</div>
      <div class="question-title">${step.title}</div>
      <div class="options">
  `;

  step.options.forEach(opt => {
    const isSelected = selectedVal === opt.value;
    html += `
      <button class="opt-btn ${isSelected ? 'selected' : ''}" onclick="selectOption('${step.key}', '${opt.value}')">
        <div class="icon">${opt.icon}</div>
        <div class="opt-text">
          <div><b>${opt.text}</b></div>
          <div class="opt-desc">${opt.desc}</div>
        </div>
      </button>
    `;
  });

  html += `</div><div class="nav-btns">`;
  if (currentStep > 0) {
    html += `<button class="nav-btn" onclick="goBack()">← 上一步</button>`;
  } else {
    html += `<div></div>`;
  }
  html += `<button class="nav-btn primary" id="nextBtn" ${selectedVal === undefined ? 'disabled' : ''} onclick="goNext()">下一步 →</button>`;
  html += `</div></div>`;

  app.innerHTML = html;
}

function selectOption(key, value) {
  state[key] = value;
  render();
}

function goNext() {
  const visibleSteps = getVisibleSteps();
  if (currentStep < visibleSteps.length - 1) {
    currentStep++;
    render();
  } else {
    currentStep = visibleSteps.length;
    render();
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    render();
  }
}

function renderResult(app) {
  const result = getResult(state);
  let html = `
    <div class="result-card">
      <div class="result-header">
        <h2>🔮 您的专属命理分析报告</h2>
      </div>
      <table class="summary-table">
        <thead><tr><th>分析维度</th><th>您的选择</th></tr></thead>
        <tbody>
  `;

  // Build breadcrumb selections
  const visibleSteps = getVisibleSteps();
  visibleSteps.forEach((step, i) => {
    const opt = step.options.find(o => o.value === state[step.key]);
    if (opt) {
      html += `<tr><th>${step.label}</th><td>${opt.icon} ${opt.text}</td></tr>`;
    }
  });

  html += `</tbody></table>`;

  result.sections.forEach(sec => {
    html += `
      <div class="result-section ${sec.cls}">
        <h3>${sec.title}${sec.tag ? `<span class="tag ${sec.tag.cls}">${sec.tag.text}</span>` : ''}</h3>
        <p>${sec.content}</p>
      </div>
    `;
  });

  html += `
      <button class="restart-btn" onclick="restart()">🔄 重新分析</button>
    </div>
  `;

  app.innerHTML = html;
}

function restart() {
  state = {};
  currentStep = 0;
  render();
}

// Initial render
render();
</script>
