const answers = {};
let isStrong = true;

// ========== 通用 ==========
function selectOption(btn, stepNum) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers['step' + stepNum] = btn.dataset.val;
}

function goNext(stepNum) {
  const key = 'step' + stepNum;
  if (!answers[key]) { alert('请先选择一个选项'); return; }
  if (stepNum === 4) buildStep6();
  showStep(stepNum + 1);
}

function goBack(stepNum) {
  showStep(stepNum - 1);
}

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('step' + n);
  if (el) el.classList.add('active');
  updateProgress(n);
  window.scrollTo(0, 0);
}

function updateProgress(n) {
  const total = 10;
  const pct = (n / total * 100).toFixed(0);
  let bar = document.querySelector('.progress-fill');
  let txt = document.querySelector('.progress-text');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = '第 ' + n + ' / ' + total + ' 题';
}

  const s4 = answers['step4'];
  isStrong = (s4 === '身强');
  const list = step6Options[s4] || step6Options['身强'];
  const container = document.getElementById('step6-options');
  container.innerHTML = '';

    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.val = name;
    btn.textContent = name;
    btn.onclick = function() { selectOption(this, 6); };
    container.appendChild(btn);
  });
}

  var texts = {

    'step2': industryTexts[answers['step2']] || '',
    'step3': platformTexts[answers['step3']] || '',
    'step4': shenTexts[answers['step4']] || '',
    'step5': modeTexts[answers['step5']] || '',
    'step6': mentalTexts[answers['step6'] + '_' + (isStrong ? '强' : '弱')] || '',
    'step7': wealthTexts[answers['step7']] || '',
    'step8': statusTexts[answers['step8']] || '',
    'step9': comfortTexts[answers['step9']] || '',
    'step10': dayunTexts[answers['step10']] || ''
  };

  // 工作岗位额外文本（仅step1有）
  var jobExtra = {
    'step1': answers['step1'],
    'step2': null, 'step3': null, 'step4': null, 'step5': null,
    'step6': null, 'step7': null, 'step8': null, 'step9': null, 'step10': null
  };

  for (var i = 1; i <= 10; i++) {
    var key = 'step' + i;
    var val = answers[key];
    var block = document.createElement('div');
    block.className = 'summary-block';

    var title = document.createElement('div');
    title.className = 'summary-title';
    title.innerHTML = '<span class="summary-num">' + i + '</span>' + labels[key] + '：<strong>' + val + '</strong>';
    block.appendChild(title);

    var text = texts[key];
    if (text) {
      var body = document.createElement('div');
      body.className = 'summary-body';
      body.textContent = text;
      block.appendChild(body);
    }

    container.appendChild(block);
  }

  // 引动职场雷区（附加在最后）
  var leiquBlock = document.createElement('div');
  leiquBlock.className = 'summary-block';
  var leiquTitle = document.createElement('div');
  leiquTitle.className = 'summary-title';
  leiquTitle.innerHTML = '<span class="summary-num">!</span>引动职场雷区';
  leiquBlock.appendChild(leiquTitle);
  var leiquBody = document.createElement('div');
  leiquBody.className = 'summary-body';
  leiquBody.textContent = leiquText;
  leiquBlock.appendChild(leiquBody);
  container.appendChild(leiquBlock);

  window.scrollTo(0, 0);
}

// ========== 重新测试 ==========
function restart() {
  for (var k in answers) delete answers[k];
  document.querySelectorAll('.opt-btn').forEach(function(b) { b.classList.remove('selected'); });
  document.getElementById('summary').classList.remove('active');
  showStep(1);
}

// ========== 初始化 ==========
(function() {
  var wrap = document.querySelector('.progress-wrap');
  if (!wrap) {
    var container = document.querySelector('.container');
    var div = document.createElement('div');
    div.className = 'progress-wrap';
    div.innerHTML = '<div class=\'progress-bar\'><div class=\'progress-fill\' style=\'width:10%\'></div></div><div class=\'progress-text\'>第 1 / 10 题</div>';
    container.insertBefore(div, container.firstChild);
  }
  var steps = [1,2,3,4,5,7,8,9,10];
  steps.forEach(function(n) {
    var el = document.getElementById('step' + n);
    if (el) {
      el.querySelectorAll('.opt-btn').forEach(function(btn) {
        btn.onclick = function() { selectOption(this, n); };
      });
    }
  });
})();
</script>
</main>
