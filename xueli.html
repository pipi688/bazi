var koujue_text = '无印不文：八字一点印星没有，或者印星死绝，别指望高学历，哪怕再聪明也是野路子。\n有印无官，难登金榜：只有印星没有官杀，平时成绩好，但一到大考就拉胯（缺乏应试运气和抗压能力）。\n财多坏印，半途而废：印星本有用，被财星干掉，多半因贪玩、早恋或想赚钱而辍学。\n官印相生，清华北大：最正统的高学历标志，名校苗子。\n食伤制杀，偏门高才：没有印星，全靠食伤去克制官杀。这种人是解题天才，极其聪明，但不爱背书，往往是理科尖子、竞赛保送生，或者走技术突破路线。';

// ========== 全局状态 ==========
var currentQ = 0;
var answers = {};

// ========== 获取实际题目列表（含跳过逻辑） ==========
function getActiveQuestions() {
  var active = [];
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    active.push(q);
    // 第3题选了"没有官印相生"→ 跳过第4题
    if (q.id === 'guanyin_xiji' && answers['guanyin_xiji'] === 'guan_yin_wu') {
      i++;
    }
    // 第5题选了"没有枭神夺食"→ 跳过第6题
    if (q.id === 'liaoshenduoshi_xiji' && answers['liaoshenduoshi_xiji'] === 'liaoshen_wu') {
      i++;
    }
    // 第7题选了"没有食神制杀"→ 跳过第8题
    if (q.id === 'shishangzhisha' && answers['shishangzhisha'] === 'shishang_qisha_wu') {
      i++;
    }
    // 第9题选了"没有伤官配印"→ 跳过第10题
    if (q.id === 'shangguan_yinxing' && answers['shangguan_yinxing'] === 'shangguan_yin_wu') {
      i++;
    }
    // 第11题选了"没有群比抗杀"→ 跳过第12题
    if (q.id === 'qunbikangsha' && answers['qunbikangsha'] === 'qunbi_wu') {
      i++;
    }
    // 第13题选了"没有财星破印"→ 跳过第14题
    if (q.id === 'caixingpoyin' && answers['caixingpoyin'] === 'cai_yin_wu') {
      i++;
    }
  }
  return active;
}

// ========== 渲染题目 ==========
function renderQuestion(idx) {
  var activeQ = getActiveQuestions();
  var total = activeQ.length;
  var q = activeQ[idx];
  if (!q) return;

  var html = '';
  html += '<div class="question-num">第 ' + (idx + 1) + ' / ' + total + ' 题</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + ((idx / total) * 100) + '%"></div></div>';
  html += '<div class="question-title">' + q.title + '</div>';
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    var selClass = (answers[q.id] === opt.value) ? ' selected' : '';
    html += '<div class="option-item' + selClass + '" data-val="' + opt.value + '">' + opt.label + '</div>';
  }
  html += '</div>';
  html += '<div class="btn-row">';
  html += '<button class="btn" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>上一题</button>';
  if (idx < total - 1) {
    html += '<button class="btn btn-primary" id="nextBtn" disabled>下一题</button>';
  } else {
    html += '<button class="btn btn-primary" id="nextBtn" disabled>查看结果</button>';
  }
  html += '</div>';
  $('#app').html(html);

  $('.option-item').on('click', function() {
    var val = $(this).data('val');
    answers[q.id] = val;
    $('.option-item').removeClass('selected');
    $(this).addClass('selected');
    $('#nextBtn').prop('disabled', false);
  });

  $('#prevBtn').on('click', function() {
    if (idx > 0) {
      currentQ--;
      renderQuestion(currentQ);
    }
  });

  $('#nextBtn').on('click', function() {
    if (idx < total - 1) {
      currentQ++;
      renderQuestion(currentQ);
    } else {
      renderSummary();
    }
  });
}
