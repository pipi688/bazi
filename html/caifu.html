<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财富分析测试</title>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; font-size: 15px; line-height: 1.7; }
.container { max-width: 720px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
.page { display: none; }
.page.active { display: block; }
h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 12px; color: #1a1a1a; }
h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; color: #1a1a1a; text-align: center; }
.desc { text-align: center; color: #666; margin-bottom: 28px; font-size: 14px; }
.progress { display: flex; align-items: center; margin-bottom: 24px; gap: 10px; }
.progress-bar { flex: 1; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: #333; border-radius: 3px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: #999; white-space: nowrap; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.option { display: flex; align-items: center; padding: 12px 16px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: all 0.15s; user-select: none; }
.option:hover { border-color: #999; }
.option.selected { border-color: #333; background: #f0f0f0; }
.option input { margin-right: 10px; accent-color: #333; }
.option label { cursor: pointer; flex: 1; }
.btn-row { display: flex; justify-content: space-between; gap: 12px; }
.btn { padding: 10px 24px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.15s; }
.btn:hover { background: #f0f0f0; }
.btn-primary { background: #333; color: #fff; border-color: #333; }
.btn-primary:hover { background: #555; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.info-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.info-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 140px; color: #666; font-size: 14px; flex-shrink: 0; }
.info-value { font-weight: 500; font-size: 14px; }
.result-section { margin-bottom: 24px; }
.result-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 500; border: 1px solid #e0e0e0; }
td { padding: 8px 10px; border: 1px solid #e0e0e0; vertical-align: top; }
tr:nth-child(even) { background: #fafafa; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; }
.tag-yes { background: #e8f5e9; color: #2e7d32; }
.tag-no { background: #fce4ec; color: #c62828; }
.tag-info { background: #e3f2fd; color: #1565c0; }
.text-small { font-size: 13px; color: #555; line-height: 1.8; }
</style>
</head>
<body>

<div class="container" id="app">

  <!-- Page 0: Welcome -->
  <div class="page active" id="page-welcome">
    <h1>财富分析测试</h1>
    <p class="desc">请根据您的八字信息，依次回答以下问题，系统将在最后为您生成完整的财富分析报告。</p>
    <div style="text-align:center; margin-top: 30px;">
      <button class="btn btn-primary" id="btn-start" style="padding: 12px 48px; font-size: 16px;">开始测试</button>
    </div>
  </div>

  <!-- Question pages -->
  <div class="page" id="page-question">
    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <h2 id="question-title"></h2>
    <div class="options" id="question-options"></div>
    <div class="btn-row">
      <button class="btn" id="btn-prev">上一题</button>
      <button class="btn btn-primary" id="btn-next">下一题</button>
    </div>
  </div>

  <!-- Result page -->
  <div class="page" id="page-result">
    <h1 style="margin-bottom: 24px;">财富分析报告</h1>
    <div id="result-content"></div>
    <div style="text-align:center; margin-top: 30px;">
      <button class="btn" id="btn-restart">重新测试</button>
    </div>
  </div>

</div>

  // ========== Analysis Text ==========
  var analysisText = {
    '有财星': '正财：现金流 / 固定资产 / 硬劳动（工资、提成、店铺租金、按部就班的积蓄）\n偏财：资产溢价 / 杠杆 / 资本运作 / 机遇（股票、拆迁、风投、奖金、突然的暴利）',

    '忌神': '钱是主人，没有能力承载财富，赚来的钱要么留不住，要么带来了麻烦，为钱奔波、为钱焦虑。',

    '身强+财星弱+喜神': '能力极强，且很渴望赚钱，但赚钱的机会少，没有大资金也没有好项目。需等运来扶起财星。容易错估了"财衰"，总想"以小博大"，掉进偏门。\n建议：放弃"以小博大"的偏门。直接去打工/出卖技能。凭借你极其强大的执行力，去大平台做高薪打工仔/高管。大平台水多，能接住你的身强。',
    '身强+财星弱+忌神': '看不上小钱，赚不到大钱，眼高手低。用虚假的"精神富足"掩盖现实的"物质匮乏"，导致一辈子原地踏步。\n建议：面子不值钱，放下身段去赚钱。必须强迫自己去接触你原本鄙视的"俗人俗事"。哪怕去摆地摊、做点小生意，也是好的开始。把你那无处安放的"身强"精力，转化为极其落地的"苦力活"。先解决"无米之炊"的生存问题，再谈精神追求。',
    '身弱+财星旺+喜神': '赚钱的机会多，但因为"身弱"底盘不稳，每天看着这笔巨款，内心都处于"如履薄冰"的极度恐慌中。你极其害怕失去它，对金钱有极度的焦虑症，像个提心吊胆的守财奴，表面风光，内心恐惧。\n建议：立刻用钱去买"土"（房产、大额保单、黄金）。把钱死死锁在固定资产里。你没有能力驾驭这笔钱，那就把钱"寄存"在一个强大且靠谱的系统或人身上（比如交给绝对忠诚的家族信托、极度老实的家族企业）。让系统/别人帮你守财，你只享受利息，绝对不要碰本金。',

      + '<p style="margin-bottom: 4px;"><strong>原局有财，流年遇食神/伤官</strong>：这叫"源头活水"，食伤为喜去生原局的财，你的才华（食伤）能直接变成真金白银。</p>'
      + '<p style="margin-bottom: 8px;"><strong>原局无财，流年遇食伤</strong>：这一年你脑子极其活跃，想干大事，但因为没有财星（目标不明确），往往是忙活了一年，赚了名声没赚到钱。</p>'
      + '<h4 style="margin: 16px 0 8px 0; font-size: 14px;">5. 看流年有没有财星的护卫</h4>'
      + '<p style="margin-bottom: 4px;"><strong>遇到"官杀"护卫（官星护财）</strong>：流年财星来了，同时来了个"正官"或"七杀"。这十年/这一年，你赚钱极有秩序，有法律保护，有贵人（领导/平台）撑腰，别人不敢抢你的钱。（大吉）</p>'
      + '<p style="margin-bottom: 8px;"><strong>遇到"比劫"劫夺（比劫夺财）</strong>：流年财星来了，但同时来了个"比肩"或"劫财"。这叫"群狼分食"。这一年你确实赚到了钱，但马上就会被兄弟借钱不还、合伙人卷款、或者因为生病/意外把钱花光。</p>'
      + '<h4 style="margin: 16px 0 8px 0; font-size: 14px;">6. 看流年中财库的情况</h4>'
      + '<p style="margin-bottom: 4px;"><strong>财库被冲开（相冲）</strong>：财库为喜神，开库发大财，往往是卖房、套现、拿到大笔融资的一年。财库为忌神，塌库，家里老人重病花光积蓄，或投资爆仓。</p>'
      + '<p style="margin-bottom: 4px;"><strong>财库被刑坏（相刑）</strong>：比如原局财库在"戌"，流年遇到"丑"（丑戌刑）。这叫"财库漏水"，钱在不知不觉中流失，比如被电信诈骗、或者账目对不上亏了钱。</p>'
      + '<p style="margin-bottom: 4px;"><strong>财库被合（三合/六合）</strong>：财库为喜神，资金被高效整合；财库为忌神，资金被套牢。</p>'
      + '<p style="margin-bottom: 4px;"><strong>财库被会（三会）</strong>：财库为喜神，资金集中到账，或形成巨大的产业垄断。资产呈"集团化"趋势；财库为忌神，极大的负债或资金周转压力。</p>'
      + '<p style="margin-bottom: 8px;"><strong>财库被绊（合绊）</strong>：财库为喜神，主动"锁住"财富，强制储蓄或锁定收益；财库为忌神，被动"锁住"财富，资金被占用或冻结。</p>'
  };

  // ========== State ==========
  var answers = {};
  var currentQuestionIndex = 0; // index into the filtered active questions array

  // Get the list of questions that should be shown based on current answers
  function getActiveQuestions() {
    var active = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      if (q.dependsOn) {
        var depVal = answers[q.dependsOn];
        if (!depVal) continue; // dependency not met
        var matched = false;
        if (Array.isArray(depVal)) {
          for (var j = 0; j < depVal.length; j++) {
            if (q.dependsValue === depVal[j]) { matched = true; break; }
          }
        } else {
          matched = (q.dependsValue === depVal);
        }
        if (!matched) continue;
      }
      active.push(q);
    }
    return active;
  }

  // Get the current question object
  function getCurrentQuestion(activeList) {
    if (!activeList) activeList = getActiveQuestions();
    if (currentQuestionIndex >= activeList.length) currentQuestionIndex = activeList.length - 1;
    if (currentQuestionIndex < 0) currentQuestionIndex = 0;
    return activeList[currentQuestionIndex];
  }

  // Render current question
  function renderQuestion() {
    var active = getActiveQuestions();
    var q = getCurrentQuestion(active);

    // Progress
    var totalQ = active.length;
    var displayNum = currentQuestionIndex + 1;
    $('#progress-fill').css('width', (displayNum / totalQ * 100) + '%');
    $('#progress-text').text(displayNum + ' / ' + totalQ);

    // Title
    $('#question-title').text(q.title);

    // Options
    var html = '';
    var saved = answers[q.id];
    if (!saved) saved = q.type === 'multi' ? [] : null;

    for (var i = 0; i < q.options.length; i++) {
      var opt = q.options[i];
      var checked = false;
      if (q.type === 'multi') {
        checked = saved && saved.indexOf(opt.value) >= 0;
      } else {
        checked = (saved === opt.value);
      }
      html += '<div class="option' + (checked ? ' selected' : '') + '" data-value="' + opt.value + '">'
            + '<input type="' + (q.type === 'multi' ? 'checkbox' : 'radio') + '" name="' + q.id + '" value="' + opt.value + '"' + (checked ? ' checked' : '') + '>'
            + '<label>' + opt.text + '</label>'
            + '</div>';
    }
    $('#question-options').html(html);

    // Nav buttons
    $('#btn-prev').prop('disabled', currentQuestionIndex === 0);
    $('#btn-next').text(currentQuestionIndex === active.length - 1 ? '查看结果' : '下一题');

    // Click handler
    $('#question-options .option').off('click').on('click', function() {
      var val = $(this).data('value');
      if (q.type === 'multi') {
        var arr = answers[q.id] || [];
        var idx = arr.indexOf(val);
        if (idx >= 0) {
          arr.splice(idx, 1);
        } else {
          arr.push(val);
        }
        answers[q.id] = arr;
        $(this).toggleClass('selected');
        $(this).find('input').prop('checked', idx < 0);
      } else {
        answers[q.id] = val;
        $('#question-options .option').removeClass('selected');
        $(this).addClass('selected');
        $(this).find('input').prop('checked', true);
      }
    });
  }

  // Validate current question
  function canProceed() {
    var active = getActiveQuestions();
    var q = active[currentQuestionIndex];
    if (!q) return false;
    var ans = answers[q.id];
    if (q.type === 'multi') {
      return ans && ans.length > 0;
    } else {
      return !!ans;
    }
  }

  // Next question
  function nextQuestion() {
    if (!canProceed()) {
      alert('请先选择答案');
      return;
    }
    var active = getActiveQuestions();
    if (currentQuestionIndex < active.length - 1) {
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  // Previous question
  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion();
    }
  }

  // ========== Build Result Page ==========
  function showResult() {
    $('#page-question').removeClass('active');
    $('#page-result').addClass('active');

    var html = '';

    // ---- 基本信息 ----
    html += '<div class="info-box result-section">'
          + '<h3>基本信息</h3>'
          + '<div class="info-row"><span class="info-label">有没有财星</span><span class="info-value">' + (answers['q_has_caixing'] || '未选择') + '</span></div>'
          + '<div class="info-row"><span class="info-label">财星类型</span><span class="info-value">' + (answers['q_caixing_type'] || '未选择') + '</span></div>'
          + '<div class="info-row"><span class="info-label">身强/身弱</span><span class="info-value">' + (answers['q_shen_qiang_ruo'] || '未选择') + '</span></div>'
          + '<div class="info-row"><span class="info-label">财星喜忌</span><span class="info-value">' + (answers['q_caixing_xi_ji'] || '未选择') + '</span></div>'
          + '<div class="info-row"><span class="info-label">财星旺衰</span><span class="info-value">' + (answers['q_caixing_wang_shuai'] || '未选择') + '</span></div>'
          + '</div>';

    // ---- 综合汇总表 ----
    html += '<div class="result-section">'
          + '<h3>综合汇总表</h3>'
          + '<table>'
          + '<thead><tr>'
          + '<th style="width:15%">项目</th>'
          + '<th style="width:20%">选择结果</th>'
          + '<th style="width:65%">对应分析</th>'
          + '</tr></thead><tbody>';

    // Q1
    html += '<tr>'
          + '<td>有没有财星</td>'
          + '<td>' + (answers['q_has_caixing'] || '未选择') + '</td>'
          + '<td class="text-small">' + (analysisText[answers['q_has_caixing']] || '').replace(/\n/g, '<br><br>') + '</td>'
          + '</tr>';

    // Q2
    if (answers['q_caixing_type']) {
      html += '<tr>'
            + '<td>财星类型</td>'
            + '<td>' + answers['q_caixing_type'] + '</td>'
            + '<td class="text-small">' + (analysisText[answers['q_caixing_type']] || '') + '</td>'
            + '</tr>';
    }

    // Q3
    html += '<tr>'
          + '<td>身强身弱</td>'
          + '<td>' + (answers['q_shen_qiang_ruo'] || '未选择') + '</td>'
          + '<td class="text-small">' + (analysisText[answers['q_shen_qiang_ruo']] || '') + '</td>'
          + '</tr>';

    // Q4
    html += '<tr>'
          + '<td>财星喜忌</td>'
          + '<td><span class="tag ' + (answers['q_caixing_xi_ji'] === '喜神' ? 'tag-yes' : 'tag-no') + '">' + (answers['q_caixing_xi_ji'] || '未选择') + '</span></td>'
          + '<td class="text-small">' + (analysisText[answers['q_caixing_xi_ji']] || '') + '</td>'
          + '</tr>';

    // Q5
    html += '<tr>'
          + '<td>财星旺衰</td>'
          + '<td>' + (answers['q_caixing_wang_shuai'] || '未选择') + '</td>'
          + '<td class="text-small">' + (analysisText[answers['q_caixing_wang_shuai']] || '') + '</td>'
          + '</tr>';

    // Q6
    if (answers['q_shen_cai_jiaoliang']) {
      html += '<tr>'
            + '<td>身与财的较量</td>'
            + '<td>' + answers['q_shen_cai_jiaoliang'] + '</td>'
            + '<td class="text-small">' + (analysisText[answers['q_shen_cai_jiaoliang']] || '').replace(/\n/g, '<br><br>') + '</td>'
            + '</tr>';
    }

    // Q7
    if (answers['q_has_shishang']) {
      html += '<tr>'
            + '<td>生财源头（食伤）</td>'
            + '<td>' + answers['q_has_shishang'].replace(/_/g, ' + ').replace('有食伤 + ', '有食伤 + 财星') + '</td>'
            + '<td class="text-small">' + (analysisText[answers['q_has_shishang']] || '') + '</td>'
            + '</tr>';
    }

    // Q8
    if (answers['q_baobiao'] && answers['q_baobiao'].length > 0) {
      var baobiaoLabels = [];
      var baobiaoTexts = [];
      for (var b = 0; b < answers['q_baobiao'].length; b++) {
        var bb = answers['q_baobiao'][b];
        baobiaoLabels.push(bb);
        if (analysisText[bb]) baobiaoTexts.push(analysisText[bb]);
      }
      html += '<tr>'
            + '<td>财星保镖</td>'
            + '<td>' + baobiaoLabels.join('、') + '</td>'
            + '<td class="text-small">' + baobiaoTexts.join('<br><br>') + '</td>'
            + '</tr>';
    }

    // Q9
    html += '<tr>'
          + '<td>有没有财库</td>'
          + '<td>' + (answers['q_caiku'] || '未选择') + '</td>'
          + '<td class="text-small">' + (analysisText[answers['q_caiku']] || '') + '</td>'
          + '</tr>';

    // Q10
    if (answers['q_caiku_yindong']) {
      html += '<tr>'
            + '<td>财库引动</td>'
            + '<td>' + answers['q_caiku_yindong'] + '</td>'
            + '<td class="text-small">' + (analysisText[answers['q_caiku_yindong']] || '') + '</td>'
            + '</tr>';
    }

    html += '</tbody></table></div>';

    // ---- 大运流年看财富（放在最底下）----
    html += '<div class="result-section" style="margin-top: 30px;">'
          + '<h3>大运流年看财富</h3>'
          + '<div class="text-small" style="background:#fff; border:1px solid #e0e0e0; border-radius:6px; padding:16px; line-height:2;">'
          + analysisText['dayun_liunian']
          + '</div>'
          + '</div>';

    $('#result-content').html(html);
  }

  // ========== Event Bindings ==========
  $('#btn-start').on('click', function() {
    $('#page-welcome').removeClass('active');
    $('#page-question').addClass('active');
    currentQuestionIndex = 0;
    renderQuestion();
  });

  $('#btn-next').on('click', nextQuestion);
  $('#btn-prev').on('click', prevQuestion);

  $('#btn-restart').on('click', function() {
    answers = {};
    currentQuestionIndex = 0;
    $('#page-result').removeClass('active');
    $('#page-welcome').addClass('active');
  });

  $(document).on('keydown', function(e) {
    if ($('#page-question').hasClass('active')) {
      if (e.key === 'ArrowRight' || e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      }
    }
  });

});
</script>
</body>
</html>
