    + '<p><strong>原局弱，大运泄耗它（油尽灯枯期）：</strong>这步运不是长了新病，而是原有的虚弱发生了"质变"。原本的神经衰弱可能转变为断崖式的记忆力下降和重度抑郁；原本的眼睛干涩可能演变成实质性的视力模糊。这不是气机不通了，而是油灯没油了，核心是"补漏"而不是"泄火"。</p>'
    + '<p style="margin-top:10px"><strong>3. 最缺五行的影响（真空地带，补缺与反噬）</strong></p>'
    + '<p><strong>补上了且不被克（系统重启期）：</strong>你原局缺的五行终于来了，且没被克。这叫久旱逢甘霖，代表你的免疫系统正在重建。以前那些莫名其妙的亚健康（失眠、脱发），这段时间可能会不治而愈，体质会迎来一次升级。</p>'
    + '<p><strong>补上了但立即被旺神克死（免疫崩溃期——最凶险！）：</strong>这是所有健康格局里最要命的一种！缺的五行好不容易来了，却被命局里极旺的五行瞬间克死。极易表现为突发性的急症（如突发肾衰竭、严重药物过敏休克、急性尿毒症）。缺的东西一旦被引来又被杀，起病最急、最防不胜防。遇到这种流年，必须远离一切不确定的食物、药物和环境。</p>'
    + '<p><strong>没补上它（长期亚健康期）：</strong>大运流年没把缺的五行补上，你也不会得什么要命的大病，但就是永远处于一种"说不出的难受"中。长期的慢性疲劳、睡不醒、消化不良，去医院查所有指标都正常，但就是没精神，只能靠调理慢慢熬。</p>';

  var currentQ = 0;
  var answers = [];
  var totalQ = questions.length;

  // progress bar
  var pbHtml = '<div class="progress-wrap">'
    + '<div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>'
    + '<div class="progress-text"></div>'
    + '</div>';
  $('.container').prepend(pbHtml);

  function updateProgress(idx) {
    var pct = Math.round((idx + 1) / totalQ * 100);
    $('.progress-fill').css('width', pct + '%');
    $('.progress-text').text((idx + 1) + ' / ' + totalQ);
  }

  function renderQuestion(idx) {
    var q = questions[idx];
    var html = '';
    html += '<h2>' + q.title + '</h2>';
    html += '<div class="desc">' + q.desc + '</div>';
    html += '<ul class="option-list">';
    $.each(q.options, function(i, opt) {
      html += '<li>'
        + '<label data-idx="' + i + '">'
        + '<input type="radio" name="q' + idx + '" value="' + i + '">'
        + '<span>' + opt.text + '</span>'
        + '</label>'
        + '</li>';
    });
    html += '</ul>';
    html += '<div class="btn-row">';
    if (idx > 0) {
      html += '<button class="btn btn-prev">上一题</button>';
    } else {
      html += '<span></span>';
    }
    if (idx < totalQ - 1) {
      html += '<button class="btn btn-next">下一题</button>';
    } else {
      html += '<button class="btn btn-next">查看结果</button>';
    }
    html += '</div>';
    $('#qPage').html(html);
    // restore previous answer
    if (answers[idx] !== undefined) {
      $('#qPage .option-list label').eq(answers[idx]).addClass('selected');
      $('#qPage .option-list input[type=radio]').eq(answers[idx]).prop('checked', true);
    }
    updateProgress(idx);
  }

  // start
  $('#btnStart').on('click', function() {
    $('#startPage').removeClass('active');
    $('#qPage').addClass('active');
    currentQ = 0;
    renderQuestion(currentQ);
  });

  // option click - use event delegation on the document level for maximum reliability
  $(document).on('change', '#qPage input[type=radio]', function() {
    var idx = parseInt($(this).val(), 10);
    answers[currentQ] = idx;
    // update visual selection
    $(this).closest('.option-list').find('label').removeClass('selected');
    $(this).closest('label').addClass('selected');
  });

  // prev / next
  $(document).on('click', '#qPage .btn-prev', function() {
    if (currentQ > 0) {
      currentQ--;
      renderQuestion(currentQ);
    }
  });

  $(document).on('click', '#qPage .btn-next', function() {
    if (answers[currentQ] === undefined) {
      alert('请先选择一个选项再继续');
      return;
    }
    if (currentQ < totalQ - 1) {
      currentQ++;
      renderQuestion(currentQ);
    } else {
      showSummary();
    }
  });

  function showSummary() {
    $('#qPage').removeClass('active');
    $('#finishPage').addClass('active');

    var html = '';
    html += '<div class="summary-section">';
    html += '<h3>详细分析</h3>';
    $.each(questions, function(i, q) {
      html += '<div class="summary-result">';
      html += '<p><strong>' + q.title + '</strong></p>';
      html += '<p>' + q.options[answers[i]].result + '</p>';
      html += '</div>';
    });
    html += '</div>';

    $('#summaryContent').html(html);
    $('#dayunSection').html(dayunText);

    $('.progress-fill').css('width', '100%');
    $('.progress-text').text('已完成');
  }

  $('#btnRestart').on('click', function() {
    answers = [];
    currentQ = 0;
    $('#finishPage').removeClass('active');
    $('#startPage').addClass('active');
    $('.progress-fill').css('width', '0%');
    $('.progress-text').text('');
  });

});
</script>
</main>
</div>
</body>
</html>
