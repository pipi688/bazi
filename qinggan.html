    { label: "已婚", desc: "1.看大运流年夫妻宫是否被引动：\n  夫妻宫被冲——代表物理上的分离（分居、冷战、出差长期不见面）\n  夫妻宫被合走——代表伴侣的心/精力被外面的人或事（如赌博、游戏、其他女人）完全吸走。\n  夫妻宫合绊——代表伴侣的心/精力被外面的人或事情牵制\n  夫妻宫被害——代表冷战、互相消耗，内耗\n2.看离婚应期：\n  夫妻宫逢冲——大运或流年，直接冲克日支，代表关系突然破裂、异地分居、或剧烈冲突。\n  夫妻星被克或合走——流年把夫妻星彻底打死、合走、或者冲散时，婚姻的纽带就断了。\n  忌神加力、喜神重创——如果大运加强了你的忌神，你会对婚姻极度厌烦，主动想离" },
    { label: "离婚", desc: "1.夫妻宫为忌，看大运流年：\n  又来了忌神——代表前夫又来纠缠，或者那种\"窒息感、自我怀疑\"的心理创伤再次复发\n  克制了忌神——代表她终于把过去那个软弱的自己杀死了，彻底走出来。\n2.看大运流年财星的拉扯：\n  \"比劫夺财\"或\"官杀混杂\"代表为了财产分割、孩子抚养权，与前夫/前妻发生极其丑陋的撕逼。" }

var answers = {};
var currentStep = 1;

function getTag(label) {
  if (label.indexOf("喜") !== -1 || label.indexOf("好") !== -1 || label.indexOf("吉") !== -1 || label.indexOf("贵") !== -1) return "good";
  if (label.indexOf("忌") !== -1 || label.indexOf("凶") !== -1 || label.indexOf("消耗") !== -1 || label.indexOf("窒息") !== -1 || label.indexOf("互害") !== -1) return "bad";
  return "warn";
}

function renderStep(n) {
  var s = data[n];
  var html = '<div class="step active" id="step' + n + '"><h2>' + s.title + '</h2><div class="option-group">';

  if (s.type === "cascade-single") {
    html += '<div class="cascade-wrapper">';
    html += '<div class="cascade-main option-group">';
    for (var i = 0; i < s.categories.length; i++) {
      html += '<div class="option cascade-cat" data-step="' + n + '" data-cat="' + i + '">' + s.categories[i].label + '</div>';
    }
    html += '</div>';
    for (var ci = 0; ci < s.categories.length; ci++) {
      html += '<div class="sub-options" id="sub-' + n + '-' + ci + '">';
      html += '<div class="cascade-sub"><label>旺衰选择</label>';
      var subs = s.categories[ci].subs;
      for (var sj = 0; sj < subs.length; sj++) {
        html += '<div class="sub-option cascade-sub-opt" data-step="' + n + '" data-cat="' + ci + '" data-sub="' + sj + '">' + subs[sj].label + '</div>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  } else if (s.type === "multi") {
    for (var i = 0; i < s.options.length; i++) {
      var lbl = typeof s.options[i] === "string" ? s.options[i] : s.options[i].label;
      html += '<div class="option multi" data-step="' + n + '" data-i="' + i + '">' + lbl + '</div>';
    }
  } else {
    for (var i = 0; i < s.options.length; i++) {
      var lbl = typeof s.options[i] === "string" ? s.options[i] : s.options[i].label;
      html += '<div class="option" data-step="' + n + '" data-i="' + i + '">' + lbl + '</div>';
    }
  }

  html += '</div><div class="btn-row">';
  if (n > 1) html += '<button class="secondary" onclick="prev()">上一步</button>';
  html += '<button onclick="next()">' + (n === 12 ? '查看结果' : '下一步') + '</button>';
  html += '</div></div>';

  document.getElementById("steps").innerHTML = html;

  // restore
  if (answers[n] !== undefined) {
    if (s.type === "cascade-single") {
      if (answers[n].cat !== undefined) {
        var catEl = document.querySelector('[data-step="' + n + '"][data-cat="' + answers[n].cat + '"]');
        if (catEl) catEl.classList.add("selected");
        var subPanel = document.getElementById("sub-" + n + "-" + answers[n].cat);
        if (subPanel) subPanel.classList.add("show");
        if (answers[n].sub !== undefined) {
          var subEl = document.querySelector('[data-step="' + n + '"][data-cat="' + answers[n].cat + '"][data-sub="' + answers[n].sub + '"]');
          if (subEl) subEl.classList.add("selected");
        }
      }
    } else if (s.type === "multi") {
      for (var mi = 0; mi < answers[n].length; mi++) {
        var el = document.querySelector('[data-step="' + n + '"][data-i="' + answers[n][mi] + '"]');
        if (el) el.classList.add("selected");
      }
    } else {
      var el = document.querySelector('[data-step="' + n + '"][data-i="' + answers[n] + '"]');
      if (el) el.classList.add("selected");
    }
  }

  bindEvents();
}

function bindEvents() {
  // single options (not multi, not cascade)
  var singleOpts = document.querySelectorAll(".option:not(.multi):not(.cascade-cat):not(.cascade-sub-opt)");
  for (var i = 0; i < singleOpts.length; i++) {
    singleOpts[i].onclick = function() {
      var step = this.dataset.step;
      var i = parseInt(this.dataset.i);
      var s = data[step];
      // clear same step
      var els = document.querySelectorAll('[data-step="' + step + '"].option:not(.multi):not(.cascade-cat):not(.cascade-sub-opt)');
      for (var j = 0; j < els.length; j++) els[j].classList.remove("selected");
      this.classList.add("selected");
      answers[step] = i;
    };
  }

  // multi options
  var multiOpts = document.querySelectorAll(".option.multi");
  for (var i = 0; i < multiOpts.length; i++) {
    multiOpts[i].onclick = function() {
      var step = this.dataset.step;
      var idx = parseInt(this.dataset.i);
      this.classList.toggle("selected");
      if (!answers[step]) answers[step] = [];
      var pos = answers[step].indexOf(idx);
      if (pos > -1) answers[step].splice(pos, 1);
      else answers[step].push(idx);
    };
  }

  // cascade categories
  var cats = document.querySelectorAll(".cascade-cat");
  for (var i = 0; i < cats.length; i++) {
    cats[i].onclick = function() {
      var step = this.dataset.step;
      var cat = parseInt(this.dataset.cat);
      // clear all cats in this step
      var allCats = document.querySelectorAll('[data-step="' + step + '"].cascade-cat');
      for (var j = 0; j < allCats.length; j++) allCats[j].classList.remove("selected");
      // hide all sub panels
      var allSubs = document.querySelectorAll('[id^="sub-' + step + '-"]');
      for (var k = 0; k < allSubs.length; k++) allSubs[k].classList.remove("show");
      this.classList.add("selected");
      document.getElementById("sub-" + step + "-" + cat).classList.add("show");
      delete answers[step];
    };
  }

  // cascade sub options
  var subOpts = document.querySelectorAll(".cascade-sub-opt");
  for (var i = 0; i < subOpts.length; i++) {
    subOpts[i].onclick = function() {
      var step = this.dataset.step;
      var cat = parseInt(this.dataset.cat);
      var sub = parseInt(this.dataset.sub);
      // clear other subs in same cat
      var siblings = document.querySelectorAll('[data-step="' + step + '"][data-cat="' + cat + '"].cascade-sub-opt');
      for (var j = 0; j < siblings.length; j++) siblings[j].classList.remove("selected");
      this.classList.add("selected");
      answers[step] = { cat: cat, sub: sub };
    };
  }
}

function prev() {
  if (currentStep > 1) {
    currentStep--;
    renderStep(currentStep);
  }
}

function next() {
  var s = data[currentStep];
  var valid = false;
  if (s.type === "cascade-single") {
    valid = answers[currentStep] && answers[currentStep].sub !== undefined;
  } else if (s.type === "multi") {
    valid = answers[currentStep] && answers[currentStep].length > 0;
  } else {
    valid = answers[currentStep] !== undefined;
  }
  if (!valid) { alert("请选择一项"); return; }
  if (currentStep < 12) {
    currentStep++;
    renderStep(currentStep);
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("steps").style.display = "none";
  document.getElementById("result").style.display = "block";
  var html = '<h2>分析结果</h2>';
  for (var i = 1; i <= 12; i++) {
    var s = data[i];
    var label, desc, tag;
    if (s.type === "cascade-single") {
      var ans = answers[i];
      label = s.categories[ans.cat].label + " · " + s.categories[ans.cat].subs[ans.sub].label;
      desc = s.categories[ans.cat].subs[ans.sub].desc;
      tag = getTag(label);
    } else if (s.type === "multi") {
      var ans = answers[i];
      label = [];
      desc = [];
      for (var j = 0; j < ans.length; j++) {
        label.push(typeof s.options[ans[j]] === "string" ? s.options[ans[j]] : s.options[ans[j]].label);
        desc.push(typeof s.options[ans[j]] === "string" ? "" : s.options[ans[j]].desc);
      }
      label = label.join("、");
      desc = desc.filter(function(d) { return d; }).join("；");
      tag = "warn";
    } else {
      var ans = answers[i];
      label = typeof s.options[ans] === "string" ? s.options[ans] : s.options[ans].label;
      desc = typeof s.options[ans] === "string" ? "" : s.options[ans].desc;
      tag = getTag(label);
    }
    var tagClass = tag === "good" ? "tag-good" : tag === "bad" ? "tag-bad" : "tag-warn";
    html += '<div class="result-item">';
    html += '<div class="result-label">' + s.title + '</div>';
    html += '<div class="result-value"><span class="' + tagClass + '">' + label + '</span>\n' + desc + '</div>';
    html += '</div>';
  }
  html += '<div class="btn-row"><button class="secondary" onclick="restart()">重新分析</button></div>';
  document.getElementById("result").innerHTML = html;
}

function restart() {
  answers = {};
  currentStep = 1;
  document.getElementById("steps").style.display = "block";
  document.getElementById("result").style.display = "none";
  renderStep(1);
}

renderStep(1);
</script>
